name: backend-gate

# 月度复测 Native vs Born（GPU-O5）：防 born 升级缺口与决策表主张腐烂。
# 默认跑 GitHub-hosted Windows + LEAVES_BORN_GPU=0（CPU-only，无 self-hosted 也能跑）。
# GPU 对比：workflow_dispatch 勾选 gpu=true，且仓库变量 LEAVES_SELFHOSTED_WINDOWS=1。

on:
  schedule:
    - cron: "0 4 1 * *" # 每月 1 日 04:00 UTC
  workflow_dispatch:
    inputs:
      gpu:
        description: "Also run self-hosted Windows GPU gate"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gate-cpu:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      LEAVES_BORN_GPU: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache-dependency-path: go.sum

      - name: native vs born CPU (lg_breast_cancer)
        run: go run ./scripts/born_upgrade_gate testdata/lg_breast_cancer.txt

      - name: native vs born CPU (xgboost_smoke)
        run: go run ./scripts/born_upgrade_gate testdata/xgboost_smoke.json

  gate-gpu:
    if: github.event_name == 'workflow_dispatch' && inputs.gpu && vars.LEAVES_SELFHOSTED_WINDOWS == '1'
    runs-on: [self-hosted, windows]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache-dependency-path: go.sum

      - name: native vs born GPU (lg_breast_cancer)
        run: go run ./scripts/born_upgrade_gate testdata/lg_breast_cancer.txt

      - name: native vs born GPU (xgboost_smoke)
        run: go run ./scripts/born_upgrade_gate testdata/xgboost_smoke.json
