name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache-dependency-path: go.sum

      - name: go test
        run: go test ./...

      # POST-01：skills/（真源）与 .cursor/skills/（Cursor 发现镜像）哈希一致
      - name: skills mirror gate
        run: go test ./docs -run TestSkillsMirrorSync -count=1

  wasm:
    name: wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"

      - name: build wasm demo
        run: go build -o examples/wasm/leaves.wasm ./examples/wasm

      - name: wasm size gate (<= 16 MiB)
        env:
          LEAVES_WASM_GATE: "1"
        run: go test -run TestWasmBinarySizeGate -count=1 -timeout 10m

  bench-gate:
    name: backend bench gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"

      - name: batch=1 BornCPU slower than Native (>=20x)
        run: go test -run TestBenchGateBornCPUSlowerBatch1 -count=1 -timeout 5m

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache-dependency-path: go.sum

      - name: go test -race
        run: go test -race -short ./... -count=1

  lint:
    name: lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache-dependency-path: go.sum

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.11.4
          args: --timeout 5m
